name: LaTeX Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Compile main.tex
      uses: xu-cheng/latex-action@v3
      with:
        root_file: main.tex

    - name: Check for LaTeX errors
      run: |
        if grep -q "^!" main.log; then
          echo "LaTeX errors found:"; grep "^!" main.log; exit 1
        fi
        grep "Warning:" main.log || true
        echo "Page count:"; grep -o "Output written on main.pdf ([0-9]* pages" main.log

    - name: Upload PDF
      uses: actions/upload-artifact@v4
      with:
        name: main.pdf
        path: main.pdf
